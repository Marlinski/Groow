// The files: what never travels.
//
// These are written by the core, which runs as root, and read by the passes and by a person
// with `cat`. The encoding is the same canonical JSON as the wire, one record per line, so the
// schema here is the schema on disk.
syntax = "proto3";
package groow.records;

import "google/protobuf/struct.proto";
import "turn.proto";

// One line of state/main/*.jsonl. The conversation, and the only account of what was said.
// Only the core writes it; the mind asks and the core decides.
message JournalRecord {
  double ts = 1;
  string role = 2;
  optional string content = 3;
  optional google.protobuf.ListValue tool_calls = 4;
  optional string name = 5;
  optional string kind = 6;      // on an incoming message, which signal it was
  optional string turn = 7;      // lets a turn that went badly be left out of the window later
}

// One file in state/inbox/new: the mind's inbox, which is everything that comes at it in the
// order it arrived. The name carries the priority and the arrival time, so the next thing to
// handle is the first name in sorted order.
message Signal {
  uint32 priority = 1;
  groow.wire.SignalKind kind = 2;
  string text = 3;
  double ts = 4;
  google.protobuf.Struct meta = 5;
  uint32 attempts = 6;           // failures so far; after three it is set down
}

// One entry of state/schedule.json.
message Alarm {
  string id = 1;
  string text = 2;
  double when = 3;
  optional double repeat_s = 4;
  optional string repeat_daily = 5;   // a wall-clock time, HH:MM, local
  bool enabled = 6;
  double created = 7;
  string by = 8;
  optional double last_fired = 9;
  uint32 fires = 10;
}

// One file in state/thoughts. Work the mind set aside for itself.
message Thought {
  string id = 1;
  string goal = 2;
  Status status = 3;
  double created = 4;
  double updated = 5;
  uint32 steps = 6;
  uint32 max_steps = 7;
  string summary = 8;
  repeated groow.wire.Message history = 9;
  repeated string tools_used = 10;
  uint32 interrupted = 11;
  optional uint32 pid = 12;      // the process running it, between steps: none
  uint32 attempts = 13;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_RUNNING = 1;
    STATUS_PAUSED = 2;
    STATUS_DONE = 3;
    STATUS_KILLED = 4;
  }
}

// One line of state/training/<set>.jsonl. Two kinds, and the difference matters: an example is
// a recommendation, a decision is only a reward.
message TrainingSample {
  double ts = 1;
  Kind kind = 2;
  string by = 3;
  optional string turn = 4;

  // kind = SFT: something to become more like
  repeated groow.wire.Message messages = 5;
  map<string, double> weights = 6;

  // kind = PG: a decision that was made, and what it was worth
  repeated groow.wire.Message prompt = 7;
  optional string completion = 8;
  optional double reward = 9;
  optional string group = 10;    // samples in a group are normalised against each other
  repeated string tags = 11;

  optional double valence = 12;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_SFT = 1;
    KIND_PG = 2;
  }
}

// The birth certificate, state/birth.json. Written once, made read-only to everyone including
// root, and there is no code path anywhere that rewrites it.
message Birth {
  string id = 1;
  string name = 2;
  double born = 3;
  string lineage = 4;
  string hardware = 5;
  string mentor = 6;
  string version = 7;
}
