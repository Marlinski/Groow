[project]
name = "groow-neuro"
version = "0.3.0"
description = "Groow's neuro package: the brain that generates, the limbic system that scores a turn, and the hippocampus that turns a day into practice. The core, the agent loop and the interface are in rust/."
requires-python = ">=3.12"
dependencies = [
  "torch",
  "transformers>=5.0",
  "peft",
  "accelerate",
  "safetensors",
  "numpy",
  "aiohttp>=3.9",
  "laya>=0.1.6",
]

[project.scripts]
groow-brain = "neuro.serve:main"
groow-learn = "neuro.learn:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["neuro*"]
