[project]
name = "groow"
version = "0.3.0"
description = "The learning side of Groow: the model that generates, and the passes that change its weights. The core, the agent loop and the interface are in rust/."
requires-python = ">=3.12"
dependencies = [
  "torch",
  "transformers>=5.0",
  "peft",
  "accelerate",
  "safetensors",
  "numpy",
  "aiohttp>=3.9",
  "laya>=0.1.6",
]

[project.scripts]
groow-brain = "groow.serve:main"
groow-learn = "groow.learn:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["groow*"]
