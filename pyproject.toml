[project]
name = "groow"
version = "0.2.0"
description = "A small language model that learns by rewriting its own weights: passively from every conversation, actively through self-directed drills and self-play."
requires-python = ">=3.12"
dependencies = [
  "torch",
  "transformers>=5.0",
  "peft",
  "accelerate",
  "safetensors",
  "rich",
  "numpy",
  "textual>=0.80",
  "aiohttp>=3.9",
]

[project.scripts]
groow = "groow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["groow*"]

[tool.setuptools.package-data]
groow = ["recipes/*.md", "default_skills/*.py"]
