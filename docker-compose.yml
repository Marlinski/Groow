# The body is this image; the home is ./home. Everything Groow is or installs lives in ./home.
# Use ./birth, which creates the home, builds the body and wakes it up.
#   ./birth      ./birth stop      ./birth logs      ./birth shell      ./birth status
services:
  groow:
    build: .
    image: groow:latest
    # The core runs as root so that the state can be kept out of the mind's reach; the mind
    # itself runs as uid 1000 inside, started by the core.
    read_only: true                    # the body is immutable; only the home and /tmp are writable
    tmpfs:
      - /tmp:size=2g,exec
      - /run:size=64m
    stdin_open: true
    tty: true
    volumes:
      - ./home:/home/groow             # state/, workspace, the model, the manual, its own commands
      - ./home/.nix:/nix               # the Nix store, kept inside the home folder on the host
    devices:
      - nvidia.com/gpu=all             # CDI; after a driver upgrade: sudo nvidia-ctk cdi generate --output=/var/run/cdi/nvidia.yaml
    shm_size: "2gb"
    restart: unless-stopped
